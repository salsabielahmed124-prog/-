<style>
:root{--ink:#2b2140;--v:#6b4fbb;--v2:#563c9e;--t:#1f9e9a;--lav:#ece7f8;--bg:#faf9fc;--line:#e1dcef;--mut:#6c6580;--free:#f0b44c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 'IBM Plex Sans Arabic',Tahoma,sans-serif}
h1,h2,h3,.logo{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-weight:600;line-height:1.35;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--free);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.logo{font-size:24px;color:var(--v2);display:flex;align-items:center;gap:10px}
.banner svg{display:block;width:100%;height:auto;border-radius:22px}
.banner{margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.btn{border:0;background:var(--v);color:#fff;padding:10px 22px;border-radius:12px;font-weight:500}
.btn:hover{background:var(--v2)}
.btn.o{background:#fff;color:var(--v2);border:1px solid var(--v)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:36px 0 56px}
.hero h1{font-size:40px;text-align:right}
.hero p{color:var(--mut);max-width:48ch;font-size:18px}
.live{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 40px -24px rgba(86,60,158,.45)}
.live h3{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--t);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(31,158,154,.6)}70%{box-shadow:0 0 0 10px rgba(31,158,154,0)}100%{box-shadow:0 0 0 0 rgba(31,158,154,0)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sec{padding:44px 0}
.sec h2{font-size:28px;margin-bottom:18px}
.sec>.wrap>p{color:var(--mut);max-width:60ch;margin:0 0 24px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}
.steps div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;counter-increment:s}
.steps div::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--lav);color:var(--v2);font-weight:600;margin-bottom:8px}
.band{background:var(--lav)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.two>div{background:#fff;border-radius:16px;padding:20px}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:500}
footer{padding:28px 20px;color:var(--mut);font-size:14px;text-align:center;border-top:1px solid var(--line)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:30px 0}
.roles button{text-align:right;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.roles button:hover{border-color:var(--v)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#fff;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
aside .role{font-size:13px;color:var(--mut);margin:0 0 12px}
aside button{display:flex;align-items:center;justify-content:space-between;text-align:right;min-height:44px;border:0;background:none;padding:0 14px;border-radius:12px;color:var(--ink)}
aside button:hover{background:var(--lav)}
aside button:last-child{margin-top:6px;color:var(--mut)}
.scrim{display:none}
aside button.on{background:var(--lav);color:var(--v2);font-weight:500}
.dot{background:var(--v);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.main{padding:26px 24px 60px;max-width:820px}
.main h2{font-size:24px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:13px;padding:1px 10px;border-radius:99px;background:var(--lav);color:var(--v2)}
.tag.f{background:#fdf0d5;color:#7a5410}.tag.g{background:#d9f1ef;color:#146b68}
.mut{color:var(--mut);font-size:14px}
.ai{background:var(--lav);border-inline-start:4px solid var(--v);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.warn{background:#fdf0d5;border-radius:12px;padding:12px 14px;margin-bottom:12px}
label{display:block;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stats b{display:block;font:600 28px 'Readex Pro',sans-serif;color:var(--v2)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
.mbar{display:none;height:58px;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.burger{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;color:var(--v2);display:grid;place-items:center}
.ad{margin:28px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:right}
.adhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.adcard{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.adimg{width:92px;height:92px;border-radius:16px;background:linear-gradient(135deg,#ece7f8,#d9f1ef);display:grid;place-items:center;flex:none}
.adbody{flex:1;min-width:200px}.adbody .t{font:600 18px/1.5 'Readex Pro','IBM Plex Sans Arabic',sans-serif;margin-top:4px}.adbody p{margin:2px 0 0;color:var(--mut);font-size:15px;line-height:1.7}
.adfoot{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--mut)}
.adbox{border:1px dashed var(--line);border-radius:14px;min-height:90px;display:grid;place-items:center;color:var(--mut)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:30px}.shell{grid-template-columns:1fr}.shell{align-content:start}.mbar{display:flex}aside{display:none}aside.open{display:flex;position:fixed;top:58px;inset-inline:0;z-index:4;max-height:calc(100vh - 58px);overflow-y:auto;padding:12px;gap:4px;border:0;border-bottom:1px solid var(--line);box-shadow:0 18px 30px -18px rgba(43,33,64,.45)}aside .logo{display:none}.scrim{display:block;position:fixed;inset:58px 0 0;background:rgba(43,33,64,.28);z-index:3}}
</style>
</head>

<script>

const SUPABASE_KEY='sb_publishable_Scc37IWi9HOkCPiPa_-0kg_PiLlAA4V';
let sb=null;try{if(SUPABASE_URL&&window.supabase)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}

const L={mood:'قلق أو اكتئاب أو ضغط نفسي',addiction:'دعم في الإدمان',psychosis:'أعراض عقلية (هلاوس أو شكوك قوية)',unsure:'مش متأكد'};

const SLOTS=['اليوم 6:00 م','غدًا 11:00 ص','غدًا 4:00 م'];
const S={role:null,tab:'home',open:null,sel:null,
 get intake(){return this.pts[0].intake},set intake(v){this.pts[0].intake=v},
 get dx(){return this.pts[0].dx},set dx(v){this.pts[0].dx=v},
 get plan(){return this.pts[0].plan},set plan(v){this.pts[0].plan=v},

 pts:[
  {id:0,name:'مريض تجريبي (أنت)',age:'',intake:null,dx:'',meds:[],notes:[],plan:'',hist:[]},
  {id:1,name:'سارة محمود',age:29,dx:'اضطراب القلق العام',intake:{type:'mood',prev:'اضطراب القلق العام',dur:'أكثر من 6 شهور',meds:'سيرترالين 50 مجم',pref:'حجز مع أخصائي محدد',safety:'لا'},
   meds:[{n:'سيرترالين 50 مجم، مرة صباحًا',by:'الأخصائي'},{n:'هيدروكسيزين 25 مجم عند اللزوم',by:'الأخصائي'}],notes:[],plan:'جلسة كل أسبوعين وتمارين تنفس يوميًا، ومراجعة الدواء بعد 6 أسابيع.',
   hist:[{d:'2026-11-02',t:'تحسن في النوم، وقلق أقل في العمل.'},{d:'2026-10-05',t:'بدء سيرترالين وشرح الآثار الجانبية الشائعة.'},{d:'2026-09-14',t:'جلسة تقييم أولي: قلق مستمر وتوتر عضلي.'}]},
  {id:2,name:'يوسف عمر',age:34,dx:'اضطراب استخدام مواد، تعافٍ مبكر',intake:{type:'addiction',prev:'اضطراب استخدام مواد',dur:'أكثر من 6 شهور',meds:'نالتريكسون 50 مجم',pref:'جلسة مجانية بدون حجز',safety:'لا'},
   meds:[{n:'نالتريكسون 50 مجم، مرة يوميًا',by:'الأخصائي'}],notes:[],plan:'جلسات أسبوعية، ومجموعة دعم، ومتابعة الالتزام بالدواء مع الصيدلي.',
   hist:[{d:'2026-11-08',t:'ملتزم بالجلسات، ورغبة أقل في الانتكاس.'},{d:'2026-10-11',t:'بدء خطة التعافي وتحديد المحفزات.'}]},
  {id:3,name:'ليلى حسن',age:41,dx:'اكتئاب متوسط الشدة',intake:{type:'mood',prev:'اكتئاب',dur:'من 1 إلى 6 شهور',meds:'إسيتالوبرام 10 مجم',pref:'جلسة مجانية بدون حجز',safety:'أحيانًا'},
   meds:[{n:'إسيتالوبرام 10 مجم، مرة صباحًا',by:'الأخصائي'},{n:'ميرتازابين 15 مجم قبل النوم',by:'الأخصائي'}],notes:[],plan:'متابعة أسبوعية، وتقييم السلامة في كل جلسة، وزيادة النشاط اليومي تدريجيًا.',
   hist:[{d:'2026-11-10',t:'مزاج أفضل قليلًا، ولا تزال تعاني من الإرهاق.'},{d:'2026-10-20',t:'إضافة ميرتازابين بسبب اضطراب النوم.'},{d:'2026-10-02',t:'جلسة أولى مجانية ثم تحويل لمتابعة منتظمة.'}]},
  {id:4,name:'محمد خالد',age:23,dx:'اضطراب ذهاني قيد التقييم',intake:{type:'psychosis',prev:'',dur:'أقل من شهر',meds:'',pref:'حجز مع أخصائي محدد',safety:'لا'},
   meds:[{n:'أولانزابين 5 مجم قبل النوم',by:'الأخصائي'}],notes:[],plan:'تقييم شامل خلال أسبوعين، وإشراك الأسرة بموافقته، ومتابعة الآثار الجانبية للدواء.',
   hist:[{d:'2026-11-12',t:'نوم أفضل، وأفكار الشك أخف.'},{d:'2026-11-06',t:'جلسة تقييم عاجلة وبدء العلاج الدوائي.'}]}],
 sessions:[],reqs:[],queries:[],notif:[],freeHours:2,
 doctors:[
  {id:1,name:'د. منى عادل',title:'استشارية طب نفسي',spec:['mood','assess'],price:300,free:true},
  {id:2,name:'د. كريم سمير',title:'معالج إدمان',spec:['addiction'],price:350,free:true},
  {id:3,name:'د. هالة فؤاد',title:'أخصائية علاج نفسي',spec:['mood','assess'],price:250,free:false},
  {id:4,name:'د. أحمد يوسف',title:'استشاري أمراض عقلية',spec:['psychosis'],price:400,free:true}],
 pending:[{id:11,name:'د. نادر حسن',title:'أخصائي علاج إدمان',spec:['addiction'],price:300,free:false},{id:12,name:'د. سلمى رضا',title:'أخصائية نفسية',spec:['mood','assess'],price:220,free:true}]};
let view='land';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const note=(r,t)=>S.notif.unshift({r,t});
const doc=id=>S.doctors.find(d=>d.id===id);
function go(v){view=v;render();scrollTo(0,0)}
function enter(r){S.role=r;S.tab='home';S.menu=false;view='app';render();scrollTo(0,0)}
function tab(t){S.tab=t;S.open=null;S.menu=false;render()}
function summary(i){return `يشتكي من ${L[i.type]} منذ ${i.dur}. `+(i.prev?`تشخيص سابق: ${i.prev}. `:'لم يُشخَّص من قبل، ويُنصح بتقييم أولي. ')+`الأدوية الحالية: ${i.meds||'لا يوجد'}. يفضّل: ${i.pref}.`}
async function loadDoctors(){if(!sb)return;try{const {data}=await sb.from('doctors').select('*');if(data&&data.length){S.doctors=data.map(d=>({id:d.id,name:d.name,title:d.title,spec:d.specialties,price:d.price,free:d.free_now}));render()}}catch(e){}}

/* ===== الصفحة الرئيسية ===== */
function land(){
 const fr=S.doctors.filter(d=>d.free);
 return `<div class="wrap"><div class="top"><div class="logo">${LOGO}سكون</div><button class="btn" onclick="go('login')">ابدأ الآن</button></div>
 <div class="banner">${BAN}</div><div class="hero"><div><h1>سلامتك النفسية، أقرب إليك.</h1>
  <p>منصة تربطك بالأخصائي المناسب لحالتك، مع جلسات مجانية بدون حجز ومتابعة دوائية من صيدلي إكلينيكي.</p>
  <p><button class="btn" onclick="go('login')">جرّب النموذج</button> <button class="btn o" onclick="enter('patient');tab('docs')">تصفّح الأخصائيين</button></p></div>
  <div class="live"><h3><span class="pulse"></span> متاحون الآن لجلسة مجانية</h3>
   ${fr.map(d=>`<div class="drow"><div style="display:flex;gap:10px;align-items:center">${av(d.id,40)}<div><b>${d.name}</b><div class="mut">${d.title}</div></div></div><button class="btn sm" onclick="enter('patient');tab('free')">اطلب جلسة</button></div>`).join('')}</div></div></div>
 <div class="wrap">${ad('top')}</div>
 <div class="sec"><div class="wrap"><h2>إزاي بتشتغل؟</h2>
  <div class="steps"><div><b>سجّل وأجب عن التقييم</b><br>أسئلة قصيرة تصل للأخصائي قبل أول جلسة.</div><div><b>اختر طريقك</b><br>جلسة مجانية الآن، أو حجز مدفوع مع أخصائي تختاره.</div><div><b>قابل الأخصائي</b><br>ملفك الخاص يظهر له هو فقط.</div><div><b>تابع دواءك</b><br>الصيدلي الإكلينيكي يرد على أسئلتك.</div></div></div></div>
 <div class="sec band"><div class="wrap"><h2>الجلسات المجانية: مكسب للطرفين</h2>
  <div class="two"><div><h3>للمريض</h3><p>تدخل في أي وقت، تشوف مين متاح، وتطلب استشارة بدون حجز ولا تكلفة.</p></div><div><h3>للأخصائي</h3><p>يحدد ساعاته بنفسه، ويقدم جلسات مدفوعة بجانبها، ويوصل لمرضى أكتر.</p></div></div></div></div>
 <div class="sec"><div class="wrap"><h2>أسئلة شائعة</h2><br>
  <details><summary>هل الترشيح تشخيص؟</summary><p class="mut">لا. الترشيح مساعدة لاختيار التخصص المناسب، والتشخيص من اختصاص الأخصائي فقط.</p></details>
  <details><summary>مين يشوف بياناتي؟</summary><p class="mut">أنت وأخصائيك، والصيدلي للمعلومات الدوائية اللازمة للمتابعة فقط.</p></details>
  <details><summary>هل الدفع شغال؟</summary><p class="mut">لا، في النموذج التجريبي الدفع واجهة توضيحية فقط.</p></details>
  <details><summary>هل المنصة بديل للطوارئ؟</summary><p class="mut">لا. في الخطر الفوري اتصل بالطوارئ المحلية.</p></details></div></div>
 <div class="wrap">${ad('mid')}</div>
 <footer>سكون نموذج تجريبي لمسابقة ريادة الأعمال. البيانات وهمية، وليست خدمة طبية فعلية.</footer>`}

function login(){
 const R=[['patient','مريض','سجّل، أجب عن التقييم، واطلب جلسة.'],['doctor','أخصائي','استقبل الطلبات وسجّل ملاحظاتك.'],['pharm','صيدلي إكلينيكي','تابع الأدوية ورد على الاستفسارات.'],['admin','إدارة المنصة','راجع الأرقام ووثّق الأخصائيين.'],['demo','مريضة بملف جاهز','ادخل بملف فيه سجل مرضي وأدوية.']];
 return `<div class="wrap"><div class="top"><div class="logo">${LOGO}سكون</div><button class="btn o" onclick="go('land')">رجوع</button></div>
 <h1 style="font-size:30px">ادخل بحساب تجريبي</h1>
 <div class="roles">${R.map(r=>`<button onclick="${r[0]==='demo'?'demoPatient()':`enter('${r[0]}')`}"><h3>${r[1]}</h3><span class="mut">${r[2]}</span></button>`).join('')}</div>${ad('login')}</div>`}

/* ===== القالب العام للوحات ===== */
const NAV={patient:[['home','الرئيسية'],['assess','التقييم الأولي'],['docs','الأخصائيون'],['free','جلسة مجانية'],['sess','جلساتي'],['hist','سجلي الصحي'],['meds','أدويتي'],['notif','الإشعارات']],
 doctor:[['home','طلبات الجلسات'],['hours','ساعاتي المجانية'],['pt','ملف المريض'],['notif','الإشعارات']],
 pharm:[['home','الاستفسارات'],['rec','سجل الأدوية'],['notif','الإشعارات']],
 admin:[['home','نظرة عامة'],['ver','طلبات التوثيق']]};
function shell(){
 const n=S.notif.filter(x=>x.r===S.role).length;

function drCard(d,rec){
 return `<div class="card"><div class="row"><div style="display:flex;gap:12px;align-items:center">${av(d.id,48)}<div><b>${d.name}</b> ${rec?'<span class="tag g">قد يناسب احتياجك</span>':''}<div class="mut">${d.title}</div></div></div>
 ${d.free?'<span class="tag f">متاح الآن مجانًا</span>':''}</div>
 <p class="row"><button class="btn sm" onclick="S.open=${d.id};render()">احجز جلسة (${d.price} ج)</button>${d.free?`<button class="btn o sm" onclick="reqFree(${d.id})">اطلب جلسة مجانية</button>`:''}</p>
 ${S.open===d.id?`<div class="ai"><b>اختر موعدًا</b><p class="row">${SLOTS.map(s=>`<button class="btn o sm" onclick="book(${d.id},'${s}')">${s}</button>`).join('')}</p><span class="mut">الدفع غير مفعّل، واجهة توضيحية فقط.</span></div>`:''}</div>`}
function reqFree(id){
 if(S.reqs.some(r=>r.id===id&&r.st==='pending'))return toast('طلبك عند الأخصائي بالفعل');
 S.reqs.unshift({id,st:'pending'});note('doctor','طلب جلسة مجانية جديد من مريض');toast('تم إرسال الطلب');if(S.tab!=='free')S.tab='free';render()}
function book(id,slot){S.sessions.push({doc:doc(id).name,slot,price:doc(id).price});S.open=null;note('patient',`تم تأكيد حجزك مع ${doc(id).name} (${slot})`);note('doctor','حجز مدفوع جديد');toast('تم الحجز');S.tab='sess';render()}
async function sendIntake(){
 const i={type:$('#q1').value,prev:$('#q2').value==='yes'?($('#q2b').value||'غير محدد'):'',dur:$('#q3').value,meds:$('#q4').value,pref:$('#q5').value,safety:$('#q6').value};
 S.intake=i;if(i.meds)S.meds.push({n:i.meds,by:'المريض'});
 if(sb){try{await sb.from('intake_answers').insert({answers:i})}catch(e){}}
 toast('تم حفظ التقييم');S.tab='docs';render()}

  ${S.plan?`<div class="ai"><b>خطة المتابعة</b><p>${esc(S.plan)}</p></div>`:''}`,

 notif:notifView},
doctor:{

  <div class="card"><b>جلسات مدفوعة قادمة:</b> ${S.sessions.length}</div>`},
 hours:()=>`<h2>ساعاتي المجانية</h2><div class="card"><label for="fh">عدد الساعات الأسبوعية</label><select id="fh" onchange="S.freeHours=+this.value;toast('تم الحفظ')">${[1,2,3,4,5,6].map(n=>`<option ${n===S.freeHours?'selected':''}>${n}</option>`).join('')}</select>
  <label><input type="checkbox" style="width:auto" ${S.doctors[0].free?'checked':''} onchange="S.doctors[0].free=this.checked;toast('تم التحديث')"> متاح الآن للجلسات المجانية</label></div>`,

  <div class="card"><label for="dx">التشخيص</label><input id="dx" value="${esc(S.dx)}"><label for="md">إضافة دواء</label><input id="md" placeholder="الاسم والجرعة">

function ans(k,st){S.reqs[k].st=st;note('patient',st==='accepted'?'قبل الأخصائي طلبك، ادخل الجلسة المجانية':'الأخصائي غير متاح الآن');toast('تم');render()}
function saveRec(){S.dx=$('#dx').value;if($('#md').value)S.meds.push({n:$('#md').value,by:'الأخصائي'});if($('#nt').value)S.notes.push($('#nt').value);S.plan=$('#pl').value;
 if($('#md').value||S.plan){note('patient','تم تحديث ملفك وخطة المتابعة');note('pharm','أدوية جديدة مسجلة للمتابعة')}toast('تم الحفظ');render()}
function sendInq(){const v=$('#inq').value.trim();if(!v)return;S.queries.push({q:v,a:'',fw:false});note('pharm','استفسار دوائي جديد');toast('وصل سؤالك للصيدلي');render()}
function rep(k){const v=$('#a'+k).value.trim();if(!v)return;S.queries[k].a=v;note('patient','رد الصيدلي على استفسارك');toast('تم الرد');render()}

function verify(id,ok){const p=S.pending.find(x=>x.id===id);S.pending=S.pending.filter(x=>x.id!==id);if(ok)S.doctors.push(p);toast(ok?'تم توثيق الأخصائي':'تم الرفض');render()}

 return `<p><button class="btn o sm" onclick="S.sel=null;render()">رجوع للقائمة</button></p><h2 style="display:flex;gap:12px;align-items:center">${av(p.id,52)}${p.name}</h2>${recBody(p)}
 <div class="card"><b>تحديث الملف</b><label for="dx">التشخيص</label><input id="dx" value="${esc(p.dx)}"><label for="md">إضافة دواء</label><input id="md" placeholder="الاسم والجرعة">
 <label for="nt">ملاحظة الجلسة</label><textarea id="nt" rows="2"></textarea><label for="pl">خطة المتابعة</label><textarea id="pl" rows="2">${esc(p.plan)}</textarea>
 <p><button class="btn" onclick="saveRec()">احفظ في الملف</button></p></div>`};
V.pharm.rec=()=>`<h2>سجل الأدوية</h2><p class="mut">بيانات وهمية. يظهر للصيدلي التشخيص والأدوية والخطة فقط، دون ملاحظات الجلسات.</p>`+plist().map(p=>`<div class="card"><div class="row"><span style="display:flex;gap:10px;align-items:center">${av(p.id,40)}<b>${p.name}</b></span><span class="tag">${esc(p.dx||'لم يُحدَّد')}</span></div>${p.meds.map(m=>`<p class="row" style="margin:6px 0"><span>${esc(m.n)}</span><span class="tag">${m.by}</span></p>`).join('')||'<p class="mut">لا أدوية.</p>'}${p.plan?`<p class="mut">الخطة: ${esc(p.plan)}</p>`:''}</div>`).join('')+'<p class="mut">الصيدلي لا يعدّل التشخيص أو الوصفة، ويحوّل ما يحتاج قرارًا للطبيب.</p>';
function saveRec(){const p=S.pts.find(x=>x.id===S.sel)||S.pts[0],n=$('#nt').value.trim(),m=$('#md').value.trim();
 p.dx=$('#dx').value;if(m)p.meds.push({n:m,by:'الأخصائي'});if(n)p.hist.unshift({d:'اليوم',t:n});p.plan=$('#pl').value;
 if(p.id===0&&(m||p.plan)){note('patient','تم تحديث ملفك وخطة المتابعة');note('pharm','أدوية جديدة مسجلة للمتابعة')}toast('تم الحفظ');render()}

/* ===== الإعلانات =====
   لتفعيل Google AdSense: ضعي رقم الناشر في client (مثال 'ca-pub-123...') وأرقام الوحدات في slots.
   sample:true يعرض إعلانات تجريبية للعرض، وعند تفعيل الإعلانات الحقيقية اجعليها false. */
const ADS={client:'',slots:{top:'',mid:'',login:''},sample:true,placeholder:true};
const SAMPLES=[
 {t:'اسم المنتج الدوائي (مثال)',d:'منتج بدون وصفة طبية. إعلان توضيحي لشكل المساحة الإعلانية.'},
 {t:'فيتامينات ومكملات (مثال)',d:'اسم الشركة المعلنة يظهر هنا. إعلان توضيحي فقط.'}];
const PILL='<svg width="52" height="52" viewBox="0 0 56 56" aria-hidden="true" style="flex:none"><g transform="rotate(-35 28 28)"><rect x="5" y="20" width="46" height="16" rx="8" fill="#6b4fbb"/><path d="M13 20h15v16H13a8 8 0 0 1 0-16z" fill="#1f9e9a"/></g></svg>';
const adWrap=inner=>`<div class="ad"><div class="adhead"><span class="tag f">إعلان</span><span class="mut">محتوى برعاية جهة تجارية، وليس توصية من الأخصائيين أو الصيدلي.</span></div>${inner}<div class="adfoot">الإعلانات تظهر في الصفحة الرئيسية وصفحة الدخول فقط، ولا تظهر داخل ملفك الصحي ولا تعتمد على بياناتك.</div></div>`;
function ad(k){
 if(ADS.client&&ADS.slots[k])return adWrap(`<ins class="adsbygoogle" style="display:block" data-ad-client="${ADS.client}" data-ad-slot="${ADS.slots[k]}" data-ad-format="auto" data-full-width-responsive="true"></ins>`);
 if(ADS.sample){const a=SAMPLES[k==='mid'?1:0];return adWrap(`<div class="adcard"><div class="adimg">${PILL}</div><div class="adbody"><span class="tag">نموذج توضيحي</span><div class="t">${a.t}</div><p>${a.d}</p><p>استشر الطبيب أو الصيدلي قبل استخدام أي دواء أو مكمل.</p></div><button class="btn" onclick="toast('هذا إعلان تجريبي')">اعرف أكثر</button></div>`)}
 return ADS.placeholder?adWrap('<div class="adbox">مساحة إعلانية</div>'):''}
function runAds(){if(!ADS.client)return;document.querySelectorAll('ins.adsbygoogle:not([data-done])').forEach(e=>{e.dataset.done=1;try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(x){}})}
if(ADS.client){const sc=document.createElement('script');sc.async=true;sc.crossOrigin='anonymous';sc.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+ADS.client;document.head.appendChild(sc)}
function toggleMenu(){S.menu=!S.menu;render()}
function render(){$('#app').innerHTML=view==='land'?land():view==='login'?login():shell();runAds()}
render();loadDoctors();
</script>
</body>
</html>
